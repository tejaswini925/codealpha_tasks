<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QuoteSpark - Random Quote Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow-x: hidden; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .bg-canvas {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%; z-index: -2;
      background: linear-gradient(135deg, #e8f5e9, #b2dfdb, #e0f2f1);
      background-size: 400% 400%;
      animation: bgShift 8s ease infinite;
    }
    @keyframes bgShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .orb { position:fixed; border-radius:50%; filter:blur(90px); opacity:0.35; animation:floatOrb 8s ease-in-out infinite; z-index:-1; }
    .orb1 { width:500px; height:500px; background:#66bb6a; top:-150px; left:-150px; animation-delay:0s; }
    .orb2 { width:400px; height:400px; background:#26a69a; bottom:-100px; right:-100px; animation-delay:3s; }
    .orb3 { width:300px; height:300px; background:#a5d6a7; top:30%; left:55%; animation-delay:5s; }
    @keyframes floatOrb {
      0%,100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-40px) scale(1.08); }
    }
    .stars { position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; pointer-events:none; }
    .star  { position:absolute; background:#a5d6a7; border-radius:50%; opacity:0; animation:twinkle var(--dur) ease-in-out infinite; }
    @keyframes twinkle { 0%,100%{opacity:0;} 50%{opacity:0.6;} }

    header {
      width:100%; max-width:860px;
      display:flex; justify-content:space-between; align-items:center;
      padding-bottom:24px; z-index:1;
    }
    .logo { display:flex; align-items:center; gap:10px; }
    .logo-icon { font-size:28px; }
    .logo-text { font-size:26px; font-weight:800; color:#1b5e20; letter-spacing:-0.5px; }
    .logo-sub  { font-size:12px; color:#388e3c; font-weight:500; margin-top:2px; }
    .quote-count { font-size:14px; font-weight:700; color:#388e3c; }

    .categories {
      display:flex; gap:10px; flex-wrap:wrap;
      justify-content:center; margin-bottom:24px; z-index:1;
    }
    .pill {
      background:rgba(255,255,255,0.6);
      border:1px solid rgba(56,142,60,0.3);
      color:#388e3c; border-radius:99px;
      padding:8px 20px; font-size:13px; font-weight:600;
      cursor:pointer; transition:all 0.15s;
    }
    .pill:hover { background:rgba(102,187,106,0.3); color:#1b5e20; }
    .pill.active { background:linear-gradient(135deg,#43a047,#26a69a); color:#fff; border-color:transparent; }

    .quote-card {
      width:100%; max-width:860px;
      background:rgba(255,255,255,0.65);
      border:1px solid rgba(255,255,255,0.9);
      backdrop-filter:blur(24px);
      border-radius:28px;
      padding:56px 64px;
      box-shadow:0 16px 56px rgba(56,142,60,0.15);
      display:flex; flex-direction:column;
      align-items:center; gap:28px;
      z-index:1;
      animation:fadeIn 0.5s ease;
    }
    @keyframes fadeIn {
      from { opacity:0; transform:translateY(16px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .quote-icon { font-size:52px; color:#43a047; opacity:0.7; }
    .quote-text {
      font-size:24px; font-weight:500; color:#1b5e20;
      line-height:1.75; text-align:center; font-style:italic;
    }
    .divider {
      width:60px; height:3px;
      background:linear-gradient(90deg,#43a047,#26a69a);
      border-radius:99px;
    }
    .author-name { font-size:17px; font-weight:700; color:#388e3c; text-align:center; }
    .author-tag  { font-size:13px; color:#78909c; margin-top:5px; text-align:center; }

    .btn-row {
      display:flex; gap:16px; margin-top:32px;
      z-index:1; flex-wrap:wrap; justify-content:center;
    }
    .btn-new {
      background:linear-gradient(135deg,#43a047,#26a69a);
      color:#fff; border:none; border-radius:14px;
      padding:16px 44px; font-size:17px; font-weight:700;
      cursor:pointer; box-shadow:0 6px 24px rgba(67,160,71,0.4);
      transition:transform 0.15s, box-shadow 0.15s;
    }
    .btn-new:hover { transform:translateY(-3px); box-shadow:0 10px 32px rgba(67,160,71,0.5); }
    .btn-new:active { transform:translateY(0); }
    .btn-copy {
      background:rgba(255,255,255,0.7);
      border:1px solid rgba(56,142,60,0.3);
      color:#388e3c; border-radius:14px;
      padding:16px 30px; font-size:17px; font-weight:700;
      cursor:pointer; transition:all 0.15s;
    }
    .btn-copy:hover { background:rgba(102,187,106,0.3); color:#1b5e20; transform:translateY(-2px); }
    .btn-fav {
      background:rgba(255,255,255,0.7);
      border:1px solid rgba(56,142,60,0.3);
      color:#e91e63; border-radius:14px;
      padding:16px 22px; font-size:20px;
      cursor:pointer; transition:all 0.15s;
    }
    .btn-fav:hover { background:rgba(233,30,99,0.1); transform:translateY(-2px); }
    .btn-fav.active { background:rgba(233,30,99,0.15); }

    .toast {
      position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
      background:rgba(67,160,71,0.95); color:#fff;
      padding:12px 28px; border-radius:12px; font-size:14px; font-weight:600;
      box-shadow:0 8px 24px rgba(0,0,0,0.2);
      opacity:0; transition:opacity 0.3s; z-index:200; pointer-events:none;
    }
    .toast.show { opacity:1; }
  </style>
</head>
<body>

  <div class="bg-canvas"></div>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
  <div class="stars" id="stars"></div>

  <header>
    <div class="logo">
      <span class="logo-icon">&#127807;</span>
      <div>
        <div class="logo-text">QuoteSpark</div>
        <div class="logo-sub">Random Quote Generator</div>
      </div>
    </div>
    <span class="quote-count" id="quoteCount"></span>
  </header>

  <div class="categories" id="categoryRow"></div>

  <div class="quote-card" id="quoteCard">
    <div class="quote-icon">&#8220;</div>
    <p class="quote-text" id="quoteText"></p>
    <div class="divider"></div>
    <div>
      <div class="author-name" id="authorName"></div>
      <div class="author-tag"  id="authorTag"></div>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn-fav"  id="btnFav"  onclick="toggleFav()">&#9829;</button>
    <button class="btn-new"               onclick="newQuote()">&#8635; New Quote</button>
    <button class="btn-copy"              onclick="copyQuote()">&#128203; Copy</button>
  </div>

  <div class="toast" id="toast">Copied to clipboard!</div>

  <script>
    var starsEl = document.getElementById("stars");
    for (var i = 0; i < 60; i++) {
      var st = document.createElement("div");
      st.className = "star";
      st.style.left = (Math.random() * 100) + "%";
      st.style.top  = (Math.random() * 100) + "%";
      st.style.setProperty("--dur", (2 + Math.random() * 4) + "s");
      st.style.animationDelay = (Math.random() * 6) + "s";
      st.style.width = st.style.height = (Math.random() > 0.7 ? 6 : 4) + "px";
      starsEl.appendChild(st);
    }

    var quotes = [
      { text:"The secret of getting ahead is getting started.", author:"Mark Twain", tag:"American Author", category:"Motivation" },
      { text:"It does not matter how slowly you go as long as you do not stop.", author:"Confucius", tag:"Chinese Philosopher", category:"Motivation" },
      { text:"You don't have to be great to start, but you have to start to be great.", author:"Zig Ziglar", tag:"Motivational Speaker", category:"Motivation" },
      { text:"Believe you can and you are halfway there.", author:"Theodore Roosevelt", tag:"26th U.S. President", category:"Motivation" },
      { text:"The only way to do great work is to love what you do.", author:"Steve Jobs", tag:"Co-founder of Apple", category:"Motivation" },
      { text:"Success is not final, failure is not fatal: it is the courage to continue that counts.", author:"Winston Churchill", tag:"Former British Prime Minister", category:"Success" },
      { text:"Success usually comes to those who are too busy to be looking for it.", author:"Henry David Thoreau", tag:"American Philosopher", category:"Success" },
      { text:"Don't watch the clock; do what it does. Keep going.", author:"Sam Levenson", tag:"American Author", category:"Success" },
      { text:"Opportunities don't happen, you create them.", author:"Chris Grosser", tag:"Entrepreneur", category:"Success" },
      { text:"The road to success and the road to failure are almost exactly the same.", author:"Colin R. Davis", tag:"British Conductor", category:"Success" },
      { text:"In the middle of every difficulty lies opportunity.", author:"Albert Einstein", tag:"Theoretical Physicist", category:"Wisdom" },
      { text:"Life is what happens when you are busy making other plans.", author:"John Lennon", tag:"Musician and Activist", category:"Wisdom" },
      { text:"The future belongs to those who believe in the beauty of their dreams.", author:"Eleanor Roosevelt", tag:"Former First Lady of the USA", category:"Wisdom" },
      { text:"Spread love everywhere you go. Let no one ever come to you without leaving happier.", author:"Mother Teresa", tag:"Nobel Peace Prize Winner", category:"Wisdom" },
      { text:"When you reach the end of your rope, tie a knot in it and hang on.", author:"Franklin D. Roosevelt", tag:"32nd U.S. President", category:"Wisdom" },
      { text:"You miss 100 percent of the shots you don't take.", author:"Wayne Gretzky", tag:"Ice Hockey Legend", category:"Courage" },
      { text:"It always seems impossible until it's done.", author:"Nelson Mandela", tag:"Former President of South Africa", category:"Courage" },
      { text:"Act as if what you do makes a difference. It does.", author:"William James", tag:"American Psychologist", category:"Courage" },
      { text:"Too many of us are not living our dreams because we are living our fears.", author:"Les Brown", tag:"Motivational Speaker", category:"Courage" },
      { text:"What you get by achieving your goals is not as important as what you become by achieving your goals.", author:"Zig Ziglar", tag:"Motivational Speaker", category:"Courage" }
    ];

    var categories = ["All", "Motivation", "Success", "Wisdom", "Courage"];
    var activeCategory = "All";
    var currentIndex = 0;
    var favourites = [];

    var catRow = document.getElementById("categoryRow");
    categories.forEach(function(cat) {
      var pill = document.createElement("button");
      pill.className = "pill" + (cat === "All" ? " active" : "");
      pill.textContent = cat;
      pill.onclick = function() {
        activeCategory = cat;
        document.querySelectorAll(".pill").forEach(function(p){ p.classList.remove("active"); });
        pill.classList.add("active");
        currentIndex = 0;
        showQuote();
      };
      catRow.appendChild(pill);
    });

    function getFiltered() {
      if (activeCategory === "All") return quotes;
      return quotes.filter(function(q){ return q.category === activeCategory; });
    }

    function showQuote() {
      var filtered = getFiltered();
      var q = filtered[currentIndex % filtered.length];
      var card = document.getElementById("quoteCard");
      card.style.animation = "none";
      card.offsetHeight;
      card.style.animation = "fadeIn 0.5s ease";
      document.getElementById("quoteText").textContent  = q.text;
      document.getElementById("authorName").textContent = "— " + q.author;
      document.getElementById("authorTag").textContent  = q.tag;
      document.getElementById("quoteCount").textContent = (currentIndex % filtered.length + 1) + " / " + filtered.length;
      var isFav = favourites.indexOf(q.text) !== -1;
      document.getElementById("btnFav").classList.toggle("active", isFav);
    }

    function newQuote() {
      var filtered = getFiltered();
      currentIndex = (currentIndex + 1) % filtered.length;
      showQuote();
    }

    function toggleFav() {
      var filtered = getFiltered();
      var q = filtered[currentIndex % filtered.length];
      var idx = favourites.indexOf(q.text);
      if (idx === -1) { favourites.push(q.text); }
      else { favourites.splice(idx, 1); }
      document.getElementById("btnFav").classList.toggle("active", favourites.indexOf(q.text) !== -1);
    }

    function copyQuote() {
      var filtered = getFiltered();
      var q = filtered[currentIndex % filtered.length];
      var text = q.text + " — " + q.author;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(function() { showToast(); });
      } else {
        var el = document.createElement("textarea");
        el.value = text; document.body.appendChild(el);
        el.select(); document.execCommand("copy");
        document.body.removeChild(el); showToast();
      }
    }

    function showToast() {
      var toast = document.getElementById("toast");
      toast.classList.add("show");
      setTimeout(function(){ toast.classList.remove("show"); }, 2000);
    }

    currentIndex = Math.floor(Math.random() * quotes.length);
    showQuote();
  </script>
</body>
</html>
